<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 오피스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  /* 숲속 오피스: board/design/2026-11-11-office-concepts/fable/f-forest-v3.html 시안의 색·모양 */
  :root { --font:"Gowun Dodum","Pretendard","Malgun Gothic",system-ui,sans-serif; --serif:"Gowun Batang","Malgun Gothic",serif;
    --bg:#efe6d2; --side:#f6efdf; --pn:rgba(250,244,230,.92); --bd:1px solid rgba(90,70,40,.24); --rad:14px; --shadow:0 10px 28px rgba(60,45,20,.2);
    --text:#3a2f22; --dim:#8a7a62; --line:rgba(90,70,40,.22); --well:#ebe1cb; --btn:#fbf6ea; --card:#fbf6ea; --accent:#56733f; --sel:#d9b25a;
    --ok:#6b8f4e; --bad:#b5533c; --link:#4f6f3a; --ceo:#a8612f; --sky:#e6ecc8; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; overflow:hidden; background:var(--bg); font:13px/1.45 var(--font); color:var(--text); display:flex; }
  #stage { position:relative; flex:1; min-width:0; overflow:hidden; background:var(--sky); }
  #stage > canvas { display:block; position:absolute; inset:0; }
  #labels { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  /* 머리 위 말풍선: 굵은 태스크 제목 + 작은 진행 문장, 아래 이름표. 누르면 태스크 히스토리 */
  .tag { position:absolute; transform:translate(-50%,-100%); text-align:center; white-space:nowrap; pointer-events:auto; cursor:pointer; }
  .tag .bub { display:table; margin:0 auto 4px; background:var(--card); color:var(--text); border:1px solid rgba(90,70,40,.3); border-radius:var(--rad); padding:3px 10px 4px; line-height:1.25; box-shadow:0 4px 12px rgba(0,0,0,.22); }
  .tag .bub strong { display:block; font-size:12px; font-weight:700; }
  .tag .bub small { display:block; font-size:10.5px; color:var(--dim); }
  .tag .bub.idle { opacity:.8; }
  .tag.on .bub { outline:2px solid var(--accent); }
  .tag b { display:inline-block; font-size:11px; font-weight:600; background:rgba(58,47,34,.86); color:#fff; border-radius:9px; padding:1px 8px 1px 6px; }
  .dot, .tag b i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
  .ov { position:absolute; z-index:2; background:var(--pn); border:var(--bd); border-radius:var(--rad); padding:10px 12px; box-shadow:var(--shadow); backdrop-filter:blur(12px); }
  #hud { left:16px; top:14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; padding:8px 14px; max-width:calc(100% - 32px); }
  #hud h1 { margin:0; font:700 20px var(--serif); }
  #state { background:#b9ad95; color:#fff; border-radius:10px; padding:1px 10px; font-weight:600; font-size:12px; }
  #state.running { background:var(--ok); }
  .gauge { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); }
  .gauge div { width:66px; height:8px; border-radius:4px; background:var(--well); overflow:hidden; }
  .gauge span { display:block; height:100%; width:0; background:var(--accent); transition:width .4s; }
  #bell, #viewbtn { font-size:12px; padding:2px 9px; }
  #bell.on { background:var(--accent); color:#fff; border-color:transparent; }
  /* 태스크 히스토리 카드 */
  #hist { right:16px; top:14px; width:336px; max-height:calc(100% - 28px); overflow:auto; display:none; padding:12px 14px; }
  #hist.open { display:block; }
  #hist .hh { display:flex; gap:8px; align-items:flex-start; } #hist .hh b { font:700 17px var(--serif); flex:1; overflow-wrap:anywhere; }
  #hist .meta { font-size:12px; color:var(--dim); margin:3px 0 10px; }
  #hist ol { list-style:none; margin:0 0 2px 5px; padding:0 0 0 14px; border-left:2px solid var(--line); }
  #hist li { position:relative; padding:2px 0 7px; font-size:12.5px; overflow-wrap:anywhere; }
  #hist li:before { content:""; position:absolute; left:-20px; top:7px; width:10px; height:10px; border-radius:50%; background:var(--k); box-shadow:0 0 0 2px var(--card); }
  #hist li time { color:var(--dim); font-size:11px; margin-right:6px; font-variant-numeric:tabular-nums; }
  #hist li em { font-style:normal; font-size:10.5px; font-weight:700; border-radius:5px; padding:0 6px; margin-right:6px; background:var(--k); color:#fff; }
  #hist li u { display:block; font-size:11px; margin-left:2px; color:var(--link); text-decoration:none; cursor:pointer; }
  #hist .empty { color:var(--dim); font-size:12px; }
  /* 긴 메모·보고는 3줄까지 보이고, 눌러서 펼친다(▾는 잘렸을 때만) */
  .tx { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; white-space:pre-line; overflow-wrap:anywhere; }
  .tx.open { display:block; }
  .tx.more { cursor:pointer; }
  .fold { display:none; font-style:normal; font-size:11px; color:var(--link); cursor:pointer; }
  .tx.more + .fold { display:inline; }
  .todo.t-확인 { --t1:#c9a46a; } .todo .rep { margin-top:5px; font-size:12.5px; color:var(--text); } .todo .rep:empty { display:none; }
  /* 공유 카드: 오늘 우리 회사가 한 일 */
  #shareBox { left:16px; bottom:16px; width:290px; }
  .share { border-radius:12px; overflow:hidden; background:var(--card); border:var(--bd); }
  .sh-top { padding:7px 10px 5px; } .sh-top b, .sh-top span { display:block; } .sh-top b { font:700 15px var(--serif); } .sh-top span { font-size:10px; opacity:.8; }
  .sh-shot { display:block; width:100%; height:118px; background:var(--sky); }
  .sh-grid { display:grid; grid-template-columns:repeat(4,auto); gap:2px; text-align:center; padding:6px 6px 2px; }
  .sh-grid b { display:block; font:700 21px/1.2 var(--serif); color:var(--accent); white-space:nowrap; } .sh-grid div:nth-child(3) b { font-size:14px; line-height:1.6; }
  .sh-grid span { font-size:10px; white-space:nowrap; opacity:.85; }
  .sh-foot { font-size:10px; text-align:right; opacity:.65; padding:0 10px 5px; }
  .sh-btns { display:flex; gap:8px; margin-top:9px; } .sh-btns button { flex:1; }
  /* 오른쪽 패널 */
  aside { width:400px; flex:none; background:var(--side) linear-gradient(rgba(255,255,255,.35),transparent 30%); border-left:var(--bd); display:flex; flex-direction:column; overflow-y:auto; }
  section { padding:10px 14px; border-bottom:1px solid var(--line); }
  section h2 { margin:0 0 6px; font:700 15px var(--serif); display:flex; justify-content:space-between; align-items:baseline; }
  section h2 > span { font:12px var(--font); color:var(--dim); }
  textarea { width:100%; height:52px; resize:vertical; background:var(--well); color:var(--text); border:var(--bd); border-radius:10px; padding:6px 9px; font:inherit; }
  button { font:600 13px var(--font); color:var(--text); background:var(--btn); border:var(--bd); border-radius:10px; padding:5px 12px; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:transparent; }
  button:disabled { opacity:.45; cursor:default; }
  .row { display:flex; gap:8px; margin-top:7px; align-items:center; }
  .list { margin:0; padding:0; list-style:none; max-height:200px; overflow:auto; font-size:12px; }
  .list li { padding:3px 0; border-bottom:1px dashed var(--line); }
  .list li:last-child { border:0; }
  .list a { color:var(--link); cursor:pointer; text-decoration:none; }
  .list a .dir { color:var(--dim); font-size:11px; margin-right:2px; }
  .list .meta, .meta { color:var(--dim); font-size:11px; }
  .more { display:none; }
  #todos { max-height:42vh; overflow:auto; display:flex; flex-direction:column; gap:8px; }
  .todo { background:var(--card); border:var(--bd); border-left:4px solid var(--t1,#d9b25a); border-radius:12px; padding:6px 11px 8px; }
  .todo.t-승인 { --t1:#7fa35c; } .todo.t-입력 { --t1:#8fb4c9; } .todo.t-실행 { --t1:#b59ac9; }
  .todo .hd { display:flex; gap:8px; align-items:center; font-size:11px; color:var(--dim); margin-bottom:3px; }
  .todo .ty { background:var(--t1,#d9b25a); color:#1d1b2e; border-radius:6px; padding:0 7px; font-weight:700; }
  .todo .desc { white-space:pre-wrap; font-size:14px; font-weight:600; }
  .todo .refs { margin-top:4px; font-size:11px; overflow-wrap:anywhere; } .todo .refs a { color:var(--link); cursor:pointer; margin-right:6px; }
  .todo .opts { display:flex; flex-wrap:wrap; gap:7px; margin-top:7px; }
  .todo .opts button.sel { background:var(--sel); border-color:transparent; }
  .todo textarea { margin-top:7px; }
  .todo input { width:100%; margin-top:7px; background:var(--well); color:var(--text); border:var(--bd); border-radius:10px; padding:5px 9px; font:inherit; font-size:12px; }
  .todo .ft { display:flex; justify-content:space-between; align-items:center; margin-top:7px; }
  .todo .files, #runfiles { margin-top:6px; font-size:12px; color:var(--dim); }
  .todo .files label, #runfiles label { color:var(--link); cursor:pointer; }
  .todo .files input, #runfiles input { display:none; }
  .drop { outline:2px dashed var(--accent); outline-offset:2px; }
  .todo .err { color:var(--bad); font-size:12px; }
  #usage { width:100%; border-collapse:collapse; font-size:12px; }
  #usage th { color:var(--dim); font-weight:400; text-align:right; padding:1px 4px; }
  #usage td { text-align:right; padding:2px 4px; border-top:1px dashed var(--line); font-variant-numeric:tabular-nums; white-space:nowrap; }
  #usage th:first-child, #usage td:first-child { text-align:left; }
  #usage small { margin-left:5px; color:var(--dim); font-size:10px; }
  #usage tfoot td { font-weight:700; border-top:1px solid var(--dim); }
  /* 대화 내역: 누가 / 무엇을. 도구 사용은 한 줄로 눌러 둔다 */
  #chat { flex:1 0 300px; min-height:300px; display:flex; flex-direction:column; border-bottom:0; padding-bottom:0; }
  #chat h2 { align-items:center; }
  #chat h2 button { padding:1px 8px; font-size:12px; }
  #log { flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:2px; padding-bottom:14px; overscroll-behavior:contain; }
  #log .empty { color:var(--dim); font-size:12px; }
  .msg { display:grid; grid-template-columns:auto 1fr; column-gap:8px; padding:5px 0; font-size:13px; line-height:1.55; }
  .msg time { grid-row:span 2; color:var(--dim); font:11px/1.9 ui-monospace,Consolas,monospace; font-variant-numeric:tabular-nums; }
  .msg b { font-size:12px; font-weight:600; color:var(--dim); }
  .msg p { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.ceo p { background:#f3e3c4; border:1px solid rgba(168,97,47,.28); border-radius:4px 10px 10px 10px; padding:6px 10px; margin-top:2px; }
  .msg.ceo b { color:var(--ceo); }
  .msg.pm b, .msg.go b { color:var(--link); }
  .msg.done b { color:var(--ok); }
  .msg.tool { padding:1px 0; font-size:12px; color:var(--dim); }
  .msg.tool b { display:none; }
  .msg.tool p { grid-row:span 2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .msg.sys p { color:var(--dim); font-size:12px; }
  .msg.bad p { color:var(--bad); }
  .msg a { color:var(--link); cursor:pointer; }
  .msg code { font:.9em ui-monospace,Consolas,monospace; background:rgba(90,70,40,.1); border-radius:3px; padding:0 .3em; }
  .msg strong { color:#1d160e; }
  /* 대화 내역 크게 보기 = 전체 화면 */
  #chat.full { position:fixed; inset:0; z-index:8; background:var(--side); padding:max(14px, env(safe-area-inset-top)) max(16px, calc((100vw - 760px) / 2)) 0; }
  #chat.full #log { max-height:none; }
  #chat.full .msg { font-size:15px; } #chat.full .msg.tool { font-size:13px; }
  #viewer { position:fixed; inset:0; background:rgba(40,30,15,.45); display:none; align-items:center; justify-content:center; z-index:9; }
  #viewer.on { display:flex; }
  #viewer article { width:min(820px,94vw); max-height:88vh; display:flex; flex-direction:column; background:#fbfaf6; color:#1b2230; border-radius:6px; box-shadow:0 20px 60px rgba(0,0,0,.4); overflow:hidden; }
  #viewer header { display:flex; gap:12px; justify-content:space-between; align-items:center; padding:10px 12px 10px 20px; border-bottom:1px solid #e4e0d6; font-weight:700; }
  #vtitle { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
  #vtitle small { display:block; font-weight:400; color:#6b6457; font-size:11px; }
  #vbody { overflow:auto; padding:22px clamp(18px,5vw,44px) 40px; overscroll-behavior:contain; }
  /* 읽기용 본문 */
  .doc { max-width:68ch; margin:0 auto; font:16px/1.75 "Pretendard","Malgun Gothic",system-ui,sans-serif; word-break:keep-all; overflow-wrap:anywhere; }
  .doc > :first-child { margin-top:0; }
  .doc h1 { font-size:1.45em; line-height:1.35; margin:0 0 .8em; text-wrap:balance; }
  .doc h2 { font-size:1.2em; line-height:1.4; margin:2em 0 .6em; padding-bottom:.3em; border-bottom:1px solid #e4e0d6; }
  .doc h3 { font-size:1.05em; margin:1.6em 0 .4em; }
  .doc h4 { font-size:1em; margin:1.3em 0 .3em; color:#4a4438; }
  .doc p { margin:.7em 0; }
  .doc ul, .doc ol { margin:.6em 0; padding-left:1.3em; }
  .doc li { margin:.25em 0; }
  .doc li > ul, .doc li > ol { margin:.2em 0; }
  .doc strong { font-weight:700; color:#11161f; }
  .doc code { font:.86em/1.5 ui-monospace,Consolas,monospace; background:#efebe1; border-radius:4px; padding:.1em .35em; overflow-wrap:anywhere; }
  .doc pre { background:#1d222c; color:#e9edf4; border-radius:6px; padding:12px 14px; overflow:auto; font:13px/1.55 ui-monospace,Consolas,monospace; }
  .doc pre code { background:none; padding:0; color:inherit; }
  .doc blockquote { margin:1em 0; padding:.2em 0 .2em 1em; border-left:1px solid #c9c1b0; color:#4a4438; }
  .doc hr { border:0; border-top:1px solid #e4e0d6; margin:2em 0; }
  .doc a { color:#1f5fbf; }
  .doc img { max-width:100%; height:auto; border-radius:4px; }
  .doc .tbl { overflow-x:auto; margin:1em 0; }
  .doc table { border-collapse:collapse; font-size:14px; line-height:1.55; min-width:100%; }
  .doc th, .doc td { border:1px solid #e4e0d6; padding:7px 10px; text-align:left; vertical-align:top; min-width:7em; }
  .doc th { background:#f2eee4; font-weight:600; }
  .doc.plain { white-space:pre-wrap; font:13px/1.6 ui-monospace,Consolas,monospace; max-width:none; }
  /* 오피스 끄기: 3D 렌더 멈추고 패널만 화면 전체로 */
  body.panelonly { flex-direction:column; }
  body.panelonly #stage { flex:none; height:auto; background:var(--side); border-bottom:var(--bd); }
  body.panelonly #stage > canvas, body.panelonly #labels, body.panelonly #shareBox, body.panelonly #hist { display:none !important; }   /* three.js가 canvas에 인라인 display:block을 넣는다 */
  body.panelonly #hud { position:static; border:0; box-shadow:none; background:none; backdrop-filter:none; max-width:none; padding:10px 16px; }
  body.panelonly aside { width:auto; flex:1; min-height:0; border-left:0; }
  @media (min-width: 761px) {
    body.panelonly aside { display:grid; grid-template-columns:minmax(360px,460px) 1fr; align-content:start; }
    body.panelonly aside > section { grid-column:1; }
    body.panelonly #chat { grid-column:2; grid-row:1 / span 6; position:sticky; top:0; height:calc(100vh - 56px); border-left:1px solid var(--line); }
    body.panelonly .list { max-height:320px; }
  }
  /* 휴대폰: 오피스 위, 패널 아래로 쌓고 패널만 스크롤 */
  @media (max-width: 760px) {
    /* 페이지 하나만 스크롤한다. 안쪽 스크롤 상자가 터치를 삼켜 패널이 잘려 보이던 문제 */
    body { display:block; height:auto; min-height:100svh; overflow:visible; }
    body:has(#chat.full), body:has(#viewer.on) { overflow:hidden; }
    #stage { height:40svh; }
    #shareBox { display:none; }
    #hist { position:fixed; z-index:7; left:8px; right:8px; top:auto; bottom:8px; width:auto; max-height:60svh; }
    #hud { left:8px; top:8px; padding:5px 10px; gap:4px 10px; } #hud h1 { font-size:15px; } .gauge div { width:44px; }
    aside { width:auto; border-left:0; border-top:var(--bd); overflow:visible; padding-bottom:env(safe-area-inset-bottom); }
    section:has(#todos) { order:-1; }
    #todos, .list { max-height:none; overflow:visible; }
    .list:not(.open) li:nth-child(n+9) { display:none; }
    .more { display:block; width:100%; margin-top:8px; color:var(--link); font-size:13px; }
    .more[hidden] { display:none; }
    #chat { flex:none; min-height:0; }
    #log { flex:none; height:70svh; overscroll-behavior:auto; }
    #chat.full #log { height:auto; overscroll-behavior:contain; }
    textarea, .todo input { font-size:16px; }
    .list li { padding:0; }
    .list a { display:block; padding:11px 0; }
    .list .meta { display:none; }
    #viewer { align-items:stretch; }
    #viewer article { width:100%; max-height:none; border-radius:0; }
    #viewer header { padding:max(8px, env(safe-area-inset-top)) 8px 8px 16px; }
    #vbody { flex:1; padding:18px 18px calc(40px + env(safe-area-inset-bottom)); }
    .doc { font-size:16.5px; }
    .tag .bub small { display:none; }
    button { padding:9px 14px; }
  }
  #viewer header button { background:#e4e0d6; color:#1b2230; min-height:40px; flex:none; }
  button:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  /* 결과물 미리보기: 본문 속 저장소 경로(이미지·동영상·HTML) */
  .media img { display:block; max-width:min(100%,260px); max-height:160px; margin:4px 0; border-radius:4px; cursor:zoom-in; background:#0001; }
  .media video { display:block; max-width:100%; max-height:260px; margin:4px 0; border-radius:4px; background:#000; }
  .media button { font-size:12px; padding:1px 8px; margin-left:4px; }
  .media.missing :is(img,video,button) { display:none; }
  .doc .media img { max-width:100%; max-height:360px; }
  #zoom { width:min(96vw,1400px); max-width:none; max-height:96vh; padding:8px; border:0; border-radius:8px; background:#2a241b; color:#f6efdf; }
  #zoom::backdrop { background:rgba(0,0,0,.8); }
  #zoom header { display:flex; gap:12px; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:13px; }
  #zoom a { color:#cfe3b0; }
  #zoom img { display:block; max-width:100%; max-height:84vh; margin:auto; cursor:zoom-out; }
  #zoom iframe { display:block; width:100%; height:84vh; border:0; background:#fff; border-radius:4px; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div id="stage">
  <div id="labels"></div>
  <div class="ov" id="hud">
    <h1 id="co">AI 오피스</h1> <span id="state">대기</span>
    <div class="gauge">5시간 <div><span id="g5"></span></div> <em id="t5">–</em></div>
    <div class="gauge">7일 <div><span id="g7"></span></div> <em id="t7">–</em></div>
    <button id="bell" title="TODO·보고 알림 소리 / 브라우저 알림">🔔 알림 켜기</button>
    <button id="viewbtn" title="3D 오피스를 끄면 렌더링을 멈추고 패널을 화면 전체로 봅니다">🖥 오피스 끄기</button>
  </div>

const NAV = { c: .4, n: 48, o: -9.6 }, navFree = new Uint8Array(NAV.n * NAV.n);
function buildNav() {
  const { c, n, o } = NAV;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const x = o + (i + .5) * c, z = o + (j + .5) * c;
    navFree[i * n + j] = Math.hypot(x, z) < 9.0 && !blocks.some((b) => Math.hypot(b.x - x, b.z - z) < b.r + .25) ? 1 : 0;
  }
}
const cellOf = (v) => [Math.floor((v.x - NAV.o) / NAV.c), Math.floor((v.z - NAV.o) / NAV.c)];
const isFree = (i, j) => i >= 0 && j >= 0 && i < NAV.n && j < NAV.n && navFree[i * NAV.n + j] === 1;
const freeAt = (v) => isFree(...cellOf(v));
function nearestFree(v) {
  const p = new THREE.Vector3(v.x, 0, v.z);
  if (freeAt(p)) return p;
  for (let r = .2; r < 4; r += .2) for (let a = 0; a < 16; a++) { const c = new THREE.Vector3(v.x + Math.cos(a * PI / 8) * r, 0, v.z + Math.sin(a * PI / 8) * r); if (freeAt(c)) return c; }
  return p;
}
function los(a, b) { const k = Math.ceil(a.distanceTo(b) / .15); for (let i = 1; i < k; i++) if (!freeAt(new THREE.Vector3().lerpVectors(a, b, i / k))) return false; return true; }
// 칸 경로를 찾고, 막힘 없이 보이는 데까지는 곧장 걸어가게 줄인다
function findPath(a, b) {
  const s0 = nearestFree(a), e = nearestFree(b), cells = gridPath(NAV.n, isFree, cellOf(s0), cellOf(e));
  if (!cells) return [e];
  const pts = [s0, ...cells.slice(1, -1).map(([i, j]) => new THREE.Vector3(NAV.o + (i + .5) * NAV.c, 0, NAV.o + (j + .5) * NAV.c)), e], out = [s0];
  for (let k = 0; k < pts.length - 1;) { let m = pts.length - 1; while (m > k + 1 && !los(pts[k], pts[m])) m--; out.push(pts[m]); k = m; }
  return out;
}

    const control = t.options.length
      ? `<div class="opts">${t.options.map((o) => `<button data-pick="${esc(o)}" class="${pick === o ? 'sel' : ''}">${esc(o)}</button>`).join('')}</div><input placeholder="메모 (선택)" value="${esc(texts.get(t.id + ':n') || '')}">`
      : t.type === '입력' ? `<textarea placeholder="답을 입력하세요">${esc(texts.get(t.id + ':t') || '')}</textarea>` : `<input placeholder="메모 (선택) — 예: 세무사 통화 완료" value="${esc(texts.get(t.id + ':n') || '')}">`;
    return `<div class="todo t-${t.type}" data-id="${t.id}"><div class="hd"><span class="ty ${t.type}">${t.type}</span> T${t.id} · ${esc(t.by)}</div>
      <div class="desc">${inline(t.desc)}</div>${refsEl(t.refs)}${control}
      <div class="files"><label>📎 파일 첨부<input type="file" multiple data-files></label> ${(picked.get(t.id) || []).map((f) => esc(f.name)).join(', ')}</div>
      <div class="ft"><span class="err"></span><button class="primary" data-submit>${t.type === '실행' ? '했어요' : '제출'}</button></div></div>`;
  }).join('') : '<div class="meta">할 일 없음</div>');
  loadReps();
}
// 확인 TODO 카드의 보고 전문(board/reports/…md의 --- 아래). 한 번 받은 글은 기억해 둔다
const repText = new Map(), repOpen = new Set();
function loadReps() {
  for (const el of $('todos').querySelectorAll('.rep[data-rep]')) {
    const ref = el.dataset.rep;
    const show = () => { el.textContent = repText.get(ref) || ''; if (!el.classList.contains('open')) el.classList.toggle('more', el.scrollHeight > el.clientHeight + 1); };
    if (!ref) continue;
    if (repText.has(ref)) { show(); continue; }
    fetch('/api/file?path=' + encodeURIComponent(ref)).then((r) => (r.ok ? r.text() : '')).then((txt) => { repText.set(ref, txt.split(/\n---\n/).slice(1).join('\n---\n').trim() || txt.trim()); show(); }).catch(() => {});
  }
}
const toB64 = (list) => Promise.all(list.map(async (f) => {
  const b = new Uint8Array(await f.arrayBuffer()); let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i + 0x8000));
  return { name: f.name, data: btoa(s) };
}));
// 파일을 끌어다 놓기: el 위에 놓으면 onFiles(File[], 놓인 대상)
function dropZone(el, onFiles) {
  el.addEventListener('dragover', (e) => { if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); el.classList.add('drop'); } });
  el.addEventListener('dragleave', (e) => { if (!el.contains(e.relatedTarget)) el.classList.remove('drop'); });
  el.addEventListener('drop', (e) => { el.classList.remove('drop'); if (!e.dataTransfer.files.length) return; e.preventDefault(); onFiles([...e.dataTransfer.files], e.target); });
}
// 놓을 곳을 빗나가도 브라우저가 파일을 열어 버리지 않게
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => e.preventDefault());
function addTodoFiles(card, list) {
  const id = Number(card.dataset.id);
  picked.set(id, [...(picked.get(id) || []), ...list]);
  card.querySelector('.files').lastChild.textContent = ' ' + picked.get(id).map((f) => f.name).join(', ');
}
dropZone($('todos'), (list, t) => { const card = t.closest?.('.todo'); if (card) addTodoFiles(card, list); });
$('todos').onchange = (e) => {
  if (e.target.dataset.files == null) return;
  addTodoFiles(e.target.closest('.todo'), [...e.target.files]);
};
$('todos').oninput = (e) => {
  if (e.target.type === 'file') return;
  const card = e.target.closest('.todo');
  if (card) texts.set(card.dataset.id + (e.target.tagName === 'TEXTAREA' ? ':t' : ':n'), e.target.value);
};
$('todos').onclick = async (e) => {
  const card = e.target.closest('.todo'); if (!card) return;
  const id = Number(card.dataset.id);
  if (e.target.dataset.p) return openPaper({ path: e.target.dataset.p, title: e.target.dataset.p });
  if (e.target.dataset.pick != null) {
    drafts.set(id, e.target.dataset.pick);
    card.querySelectorAll('[data-pick]').forEach((b) => b.classList.toggle('sel', b === e.target));
    return;
  }
  let answer, note;
  if (e.target.dataset.check) {   // 확인 TODO: 종료 또는 추가 지시(글 필요)
    answer = e.target.dataset.check; note = (card.querySelector('textarea')?.value ?? '').trim();
    if (answer === '추가 지시' && !note) return (card.querySelector('.err').textContent = '이어서 시킬 일을 적어 주세요');
  } else {
    if (e.target.dataset.submit == null) return;
    const text = card.querySelector('textarea')?.value ?? '';
    note = card.querySelector('input:not([type=file])')?.value ?? '';
    answer = card.querySelector('[data-pick]') ? drafts.get(id) : text;
    if (card.querySelector('[data-pick]') && !answer) return (card.querySelector('.err').textContent = '보기를 골라 주세요');
  }
  e.target.disabled = true;
  const files = await toB64(picked.get(id) || []);
  const r = await fetch('/api/todo', { method: 'POST', body: JSON.stringify({ id, answer, note, files }) });
  if (!r.ok) { e.target.disabled = false; return (card.querySelector('.err').textContent = (await r.json()).error); }
  drafts.delete(id); picked.delete(id); texts.delete(id + ':t'); texts.delete(id + ':n');
  log(answer === '종료' ? `T${id} 보고 확인 · 종료` : `T${id} 제출 → PM이 이어서 진행`, 'ceo', '대표');
  card.remove();
  refreshBoard();
};
// 휴대폰에서 긴 목록은 8개만 보이고 '더 보기'로 펼친다 (CSS가 데스크톱에선 버튼을 숨김)
function more(id) { const l = $(id), b = l.nextElementSibling, n = l.children.length; b.hidden = n <= 8; b.textContent = l.classList.contains('open') ? '접기' : `더 보기 (${n - 8}개 더)`; }
document.querySelectorAll('.more').forEach((b) => { b.onclick = () => { $(b.dataset.l).classList.toggle('open'); more(b.dataset.l); }; });
$('docs').onclick = (e) => { const p = e.target.closest('[data-p]')?.dataset.p; if (p) openPaper({ path: p, title: p }); };

let runFiles = [];
function showRunFiles() { $('runnames').innerHTML = runFiles.length ? esc(runFiles.map((f) => f.name).join(', ')) + ' <a id="runclear">지우기</a>' : ''; }
const addRunFiles = (list) => { runFiles = [...runFiles, ...list]; showRunFiles(); };
dropZone($('prompt').closest('section'), addRunFiles);
$('runpick').onchange = (e) => { addRunFiles([...e.target.files]); e.target.value = ''; };
$('runnames').onclick = (e) => { if (e.target.id === 'runclear') { runFiles = []; showRunFiles(); } };
async function send() {
  const prompt = $('prompt').value.trim();
  if (!prompt) return;
  const r = await fetch('/api/run', { method: 'POST', body: JSON.stringify({ prompt, files: await toB64(runFiles) }) });
  const j = await r.json();
  if (!r.ok) return log('지시 실패: ' + j.error, 'bad');
  $('prompt').value = ''; runFiles = []; showRunFiles();
}
$('send').onclick = send;
$('prompt').onkeydown = (e) => { if (e.key === 'Enter' && e.ctrlKey) send(); };
$('cancel').onclick = () => fetch('/api/cancel', { method: 'POST' });

function setRunning(on, n = on ? 1 : 0) {
  document.body.dataset.running = on ? '1' : '';
  if (!on) for (const k of hist.tasks.values()) hist.end(k.run);   // 전부 끝났거나 취소됨
  paintAll();
  $('state').textContent = on ? (n > 1 ? `작업 ${n}건 동시 진행` : '작업 중') : '대기';
  $('state').className = on ? 'running' : '';
  $('cancel').disabled = !on;
}

// 오피스 뷰 켜기/끄기 (브라우저에 기억)
function setOffice(on) {
  document.body.classList.toggle('panelonly', !on);
  $('viewbtn').textContent = on ? '🖥 오피스 끄기' : '🏢 오피스 켜기';
  try { localStorage.setItem('office-view', on ? 'on' : 'off'); } catch {}
  if (on) { resize(); if (!looping) { clock.getDelta(); frame(); } }
}
$('viewbtn').onclick = () => setOffice(document.body.classList.contains('panelonly'));
let viewPref = 'on'; try { viewPref = localStorage.getItem('office-view') || 'on'; } catch {}

// ---------- boot ----------
paintAll();
setOffice(viewPref !== 'off');   // 켜져 있으면 여기서 frame() 시작
refreshBoard();

// ---------- 실행 줄 → 사람·말풍선·히스토리·대화 내역 ----------
function handle(ev, live) {
  const p = ev.agent && someone(ev.agent);
  const m = live && motionOf(ev);
  if (m) perform(m, ev);   // 기록 다시 받기(새로고침)에서는 걷지 않는다
  switch (ev.kind) {
    case 'dispatch': log(ev.task, 'go', `PM → ${p.label}`); break;
    case 'tool': log(`${p.label} · ${ev.tool} ${ev.detail || ''}`, 'tool'); break;
    case 'paper': if (live) refreshBoard(); break;
    case 'report': log(ev.ok ? '작업 완료' + (ev.summary && ev.summary !== '완료' ? ` — ${ev.summary}` : '') : `작업 실패 — ${ev.summary || ''}`, ev.ok ? 'done' : 'bad', p.label); break;
    case 'say': if (ev.agent === 'pm') log(ev.text, 'pm', 'PM'); break;
    case 'limit': gauge('5', ev.five); gauge('7', ev.seven); break;
    case 'result':
      addReport(ev);
      if (live) { alertCeo('report', ev.error ? '최종 보고 (오류)' : '최종 보고', (ev.text || '').split('\n').find((l) => l.trim())?.replace(/^#+\s*/, '').slice(0, 120) || ''); refreshBoard(); }
      break;
  }
  if (ev.agent) paint(ev.agent);
  paint('pm');
}
function gauge(k, v) {
  if (v == null) return;
  $('g' + k).style.width = `${Math.round(v * 100)}%`;
  $('g' + k).style.background = v > 0.8 ? '#b5533c' : v > 0.5 ? '#d9a03a' : '';
  $('t' + k).textContent = `${Math.round(v * 100)}%`;
}

const feeds = new Map(); // run id -> mapper: runs interleave on one stream
const feedOf = (id) => feeds.get(id) || feeds.set(id, createMapper()).get(id);
const es = new EventSource('/api/events');
let streams = 0, skipOld = false;   // 다시 연결되면(서버 재시작 등) 이미 그린 기록은 또 받지 않는다
es.onmessage = (m) => {
  const e = JSON.parse(m.data);
  if (e.history != null) { skipOld = ++streams > 1; return; }
  if (skipOld && e._history && !e.live) return;
  evTime = e._t ?? null;
  try { onEvent(e); } finally { evTime = null; }
};
// History lines (sent to a new viewer) go through the same path; they just don't chime or refetch.
function onEvent(e) {
  const t = evTime ?? Date.now();
  if (e.type === '_office') {
    if (e.prompt) { log(e.prompt, 'ceo', '대표 지시'); hist.run(e._run, e.prompt, t); if (!e._history) perform(instructionMotion(), { paper: { title: '대표 지시', text: e.prompt } }); }
    if (e.live) {   // 기록 끝의 현재 상태: 지금 돌지 않는 옛 실행은 끝난 것으로
      for (const k of hist.tasks.values()) if (!e.live.includes(k.run)) hist.end(k.run);
      for (const id of feeds.keys()) if (!e.live.includes(id)) feeds.delete(id);
    }
    if (e.state) setRunning(e.state === 'running', e.runs);
    if (e.ended) { feeds.delete(e._run); hist.end(e._run); paintAll(); }
    if (e.log) log(e.log);
    if (e.ended && !e._history) refreshBoard();
    return;
  }
  for (const ev of feedOf(e._run)(e)) { hist.feed(ev, t, e._run); handle(ev, !e._history); }
}
es.onerror = () => log('서버 연결 끊김 — 재연결 시도 중', 'bad');
</script>
